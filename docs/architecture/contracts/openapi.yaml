openapi: 3.0.3
info:
  title: Life Tracker local application API
  version: 1.0.0
  description: Full baseline contract; the local State subset is implemented. /api/v1; single owner. R1 enables
    only R1 capabilities; unsupported routes return CAPABILITY_UNAVAILABLE.
servers:
- url: http://127.0.0.1:17841/api/v1
  description: Native baseline; port configurable by local manifest
security:
- OwnerToken: []
paths:
  /assessments:
    post:
      operationId: RecordAssessment
      tags:
      - assessments
      description: RecordAssessment
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Input too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Semantic validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency or capability unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Valid credential lacks scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - name: X-Command-ID
        in: header
        required: false
        description: Optional client command UUID; omitted means server-generated identity.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreate'
    get:
      operationId: GetAssessmentHistory
      tags:
      - assessments
      description: GetAssessmentHistory
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
