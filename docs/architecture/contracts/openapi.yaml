components:
  securitySchemes:
    OwnerToken:
      type: http
      scheme: bearer
      description: Machine-generated local credential; no user password UI. Bridge
        credential separately scoped to health import.
    BridgeToken:
      type: http
      scheme: bearer
      description: Local-paired device credential scoped to Health import only; LAN
        endpoint uses TLS and pairing public-key pin, disabled unless qualified.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - REVISION_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - SOURCE_UNAVAILABLE
          - PROCESSING_UNAVAILABLE
          - DISK_LIMIT
          - NOT_AUTHORIZED
          - CANCELLED
          - CAPABILITY_UNAVAILABLE
          - NOT_FOUND
        message: &id004
          type: string
        correlation_id: &id002
          type: string
          format: uuid
      required:
      - code
      - message
      - correlation_id
    Metric:
      type: string
      enum:
      - energy
      - mood
      - anxiety
      - physical_wellbeing
    AssessmentValue:
      type: object
      additionalProperties: false
      properties:
        metric:
          $ref: '#/components/schemas/Metric'
        score:
          type: number
          minimum: 0
          maximum: 10
          multipleOf: 0.5
      required:
      - metric
      - score
    AssessmentCreate:
      type: object
      additionalProperties: false
      properties:
        observed_at: &id001
          type: string
          format: date-time
        values:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/AssessmentValue'
        comment:
          type: string
          maxLength: 2000
      required:
      - observed_at
      - values
    AssessmentRevise:
      type: object
      additionalProperties: false
      properties:
        expected_revision: &id003
          type: integer
          minimum: 1
        observed_at: *id001
        score:
          type: number
          minimum: 0
          maximum: 10
          multipleOf: 0.5
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - expected_revision
      - observed_at
      - score
      - reason
    Receipt:
      type: object
      additionalProperties: false
      properties:
        command_id: *id002
        status:
          type: string
          enum:
          - accepted
          - completed
        resource_id: *id002
        revision: *id003
        job_id: *id002
      required:
      - command_id
      - status
    SelectedMetric:
      type: object
      additionalProperties: false
      properties:
        metric:
          $ref: '#/components/schemas/Metric'
        score:
          type: number
          nullable: true
          minimum: 0
          maximum: 10
        source_kind:
          type: string
          enum:
          - self_report
          - ai_estimate
          - unknown
        observed_at:
          type: string
          format: date-time
          nullable: true
        revision_id:
          type: string
          nullable: true
        fresh:
          type: boolean
      required:
      - metric
      - score
      - source_kind
      - fresh
    CurrentState:
      type: object
      additionalProperties: false
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/SelectedMetric'
          minItems: 4
          maxItems: 4
        balance:
          type: number
          nullable: true
          minimum: 0
          maximum: 10
        level:
          type: string
          enum:
          - undefined
          - attention
          - satisfactory
          - good
          - excellent
        computed_at: *id001
        valid_until:
          type: string
          format: date-time
          nullable: true
        rule_version: *id004
      required:
      - metrics
      - balance
      - level
      - computed_at
      - rule_version
    GameAttribute:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        value:
          type: integer
          minimum: 0
          maximum: 100
      required:
      - name
      - value
    Character:
      type: object
      additionalProperties: false
      properties:
        state:
          $ref: '#/components/schemas/CurrentState'
        game_enabled:
          type: boolean
        xp:
          type: integer
          minimum: 0
          nullable: true
        level:
          type: integer
          minimum: 1
          nullable: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/GameAttribute'
        effects:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - state
      - game_enabled
      - attributes
      - effects
    Job:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        state:
          type: string
          enum:
          - queued
          - running
          - retry_wait
          - completed
          - failed
          - cancelled
        stage: *id004
        attempt:
          type: integer
          minimum: 0
        error:
          $ref: '#/components/schemas/Error'
        result_id: *id002
      required:
      - id
      - state
      - stage
      - attempt
    MessageCreate:
      type: object
      additionalProperties: false
      properties:
        conversation_id: *id002
        text:
          type: string
          minLength: 1
          maxLength: 20000
        media_id: *id002
    MediaReceipt:
      type: object
      additionalProperties: false
      properties:
        media_id: *id002
        bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - media_id
      - bytes
      - sha256
    ExtractionDecision:
      type: object
      additionalProperties: false
      properties:
        expected_revision: *id003
        decision:
          type: string
          enum:
          - confirm
          - edit
          - reject
        edited_candidates:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - expected_revision
      - decision
    EvidenceRevise:
      type: object
      additionalProperties: false
      properties:
        expected_revision: *id003
        replacement:
          type: string
          maxLength: 20000
        reason:
          type: string
          minLength: 1
      required:
      - expected_revision
      - replacement
      - reason
    Disagreement:
      type: object
      additionalProperties: false
      properties:
        revision: *id003
        note:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - revision
      - note
    Explanation:
      type: object
      additionalProperties: false
      properties:
        entity_id: *id002
        revision: *id003
        status:
          type: string
          enum:
          - current
          - stale
          - historical
        summary: *id004
        basis:
          type: array
          items:
            type: object
            additionalProperties: true
        rule_version: *id004
      required:
      - entity_id
      - revision
      - status
      - summary
      - basis
    Settings:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          enum:
          - Europe/Moscow
        auto_confirm:
          type: boolean
        telegram_enabled:
          type: boolean
        recovery_mode:
          type: boolean
        recovery_until:
          type: string
          format: date-time
          nullable: true
        revision: &id008
          type: integer
          minimum: 1
      required:
      - revision
      - timezone
      - auto_confirm
      - telegram_enabled
      - recovery_mode
    MealCreate:
      type: object
      additionalProperties: false
      properties:
        observed_at: *id001
        media_id: *id002
        description:
          type: string
          maxLength: 2000
      required:
      - observed_at
      - media_id
    Money:
      type: object
      additionalProperties: false
      properties:
        minor_units:
          type: string
          pattern: ^-?[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        scale:
          type: integer
          minimum: 0
          maximum: 8
      required:
      - minor_units
      - currency
      - scale
    BudgetLine:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        kind:
          type: string
          enum:
          - income
          - obligation
          - spending
          - savings
        category: *id004
        amount:
          $ref: '#/components/schemas/Money'
        percent_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
        due_date:
          type: string
          format: date
      required:
      - id
      - kind
      - category
      - amount
    BudgetPlan:
      type: object
      additionalProperties: false
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        currency:
          type: string
          enum:
          - RUB
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BudgetLine'
      required:
      - month
      - currency
      - lines
    RevisionCommand:
      type: object
      additionalProperties: false
      properties:
        expected_revision: *id003
      required:
      - expected_revision
    QuestOutcome:
      type: object
      additionalProperties: false
      properties:
        expected_revision: *id003
        outcome:
          type: string
          enum:
          - completed
          - skipped
          - unknown
          - paused
        observed_at: *id001
        reason: *id004
      required:
      - expected_revision
      - outcome
      - observed_at
    Capability:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        status:
          type: string
          enum:
          - unqualified
          - enabled
          - unavailable
          - degraded
          - disabled
        last_success_at:
          type: string
          format: date-time
          nullable: true
        reason_code: *id004
      required:
      - name
      - status
    HealthBatch:
      type: object
      additionalProperties: false
      properties:
        batch_id: *id002
        checkpoint: *id004
        samples:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            properties:
              external_id: *id004
              metric:
                type: string
                enum:
                - sleep
                - steps
                - workout
                - resting_heart_rate
              start_at: *id001
              end_at: *id001
              value:
                type: number
              unit: *id004
              source_device: *id004
            required:
            - external_id
            - metric
            - start_at
            - end_at
            - unit
      required:
      - batch_id
      - samples
    Confirmation:
      type: object
      additionalProperties: false
      properties:
        confirmation_token:
          type: string
          minLength: 16
      required:
      - confirmation_token
    Page:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntitySummary'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    Report:
      type: object
      additionalProperties: false
      properties:
        coverage:
          type: string
          enum:
          - complete
          - partial
          - unavailable
          - ambiguous
        generated_at: *id001
        data:
          type: object
          additionalProperties: true
        input_revisions:
          type: array
          items: *id004
      required:
      - coverage
      - generated_at
      - data
      - input_revisions
    DeletionChallenge:
      type: object
      additionalProperties: false
      properties:
        confirmation_token:
          type: string
          minLength: 16
        expires_at:
          type: string
          format: date-time
      required:
      - confirmation_token
      - expires_at
    PersonMerge:
      type: object
      additionalProperties: false
      properties:
        target_id: &id006
          type: string
          format: uuid
        expected_revision: &id005
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
      required:
      - target_id
      - expected_revision
      - reason
    PortionRevision:
      type: object
      additionalProperties: false
      properties:
        expected_revision: *id005
        portion_grams:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 10000
        ingredients:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              food_catalog_id: &id007
                type: string
              grams:
                type: number
                minimum: 0
            required:
            - food_catalog_id
            - grams
      required:
      - expected_revision
      - portion_grams
    CategoryRevision:
      type: object
      additionalProperties: false
      properties:
        expected_revision: *id005
        category:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
      required:
      - expected_revision
      - category
      - reason
    RestoreCommand:
      type: object
      additionalProperties: false
      properties:
        backup_id: *id006
        confirmation_token:
          type: string
          minLength: 16
      required:
      - backup_id
      - confirmation_token
    EntitySummary:
      type: object
      additionalProperties: false
      properties:
        id: *id006
        revision: *id005
        kind: *id007
        summary: *id007
        observed_at:
          type: string
          format: date-time
          nullable: true
        status: *id007
      required:
      - id
      - revision
      - kind
      - status
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
